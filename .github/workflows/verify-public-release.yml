name: Verify anonymous public downloads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag to verify without authentication
        required: true
        default: v1.2.0-beta.1
      expected_commit:
        description: Full public release-tag commit; see the release source record
        required: true
permissions:
  contents: read
jobs:
  public-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Stream both public binary assets and compare full SHA-256
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 tools/verify_public_release.py --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: anonymous-public-download-verification
          path: verification/public-download-verification.json
          retention-days: 3
