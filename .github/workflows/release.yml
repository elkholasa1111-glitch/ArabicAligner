name: Native release candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag at this exact commit
        required: true
        default: v1.2.0-beta.1
      platform:
        description: Native platform(s) to package intentionally
        type: choice
        options: [both, windows, macos]
        default: both
permissions:
  contents: read
jobs:
  package:
    # Only intentional trusted runs. PR source checks have no publishing rights.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2022"]' || inputs.platform == 'macos' && '["macos-15-intel"]' || '["windows-2022","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Require draft release at the checked-out commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: runner.os == 'Windows'
        with:
          update: false
          install: make diffutils
          path-type: inherit
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Controlled media cache
        id: media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            native
            repaired-wheelhouse
            .build/sources
          key: media-${{ runner.os }}-x64-${{ hashFiles('tools/build_native_media.py', 'third_party/sources.lock.json', 'requirements-build.txt') }}
      - name: Build FFmpeg and PyAV from pinned sources
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: python tools/build_native_media.py
      - name: Install cached controlled PyAV
        if: steps.media-cache.outputs.cache-hit == 'true'
        shell: bash
        run: python -m pip install --no-deps repaired-wheelhouse/av-*.whl
      - name: Save controlled media before application acceptance
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            native
            repaired-wheelhouse
            .build/sources
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/prepare_release_assets.py
      - name: Build, install, and exercise native application
        run: python tools/release.py
      - name: Attach verified files to draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-${{ matrix.os }}
          path: verification/
          retention-days: 3
          if-no-files-found: ignore
